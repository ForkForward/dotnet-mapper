name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 10 SDK builds everything, and the tests run on the .NET 10 runtime it brings.
        dotnet-version: 10.0.x
    # The integration tests need a SQL Server. On Windows that is LocalDB.
    - name: Install SQL Server LocalDB (Windows)
      if: runner.os == 'Windows'
      run: ./Setup.ps1
      shell: pwsh
    # LocalDB does not exist on Linux, so the tests use SQL Server in a container there.
    # ACCEPT_EULA=Y accepts the Microsoft SQL Server licence terms for that container.
    # The password is generated for this run and exists only on the runner.
    - name: Start SQL Server (Linux)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        $password = 'Ff1!' + [guid]::NewGuid().ToString('N')
        docker run --detach --name sqlserver --publish 1433:1433 --env ACCEPT_EULA=Y --env "MSSQL_SA_PASSWORD=$password" mcr.microsoft.com/mssql/server:2022-latest
        if ($LASTEXITCODE -ne 0) { throw 'Could not start the SQL Server container' }
        "FORKFORWARD_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=True" >> $env:GITHUB_ENV
        foreach ($attempt in 1..60) {
          if ((docker logs sqlserver 2>&1 | Out-String) -match 'SQL Server is now ready for client connections') { return }
          Start-Sleep -Seconds 2
        }
        docker logs sqlserver
        throw 'SQL Server did not become ready in time'
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}
        # Test results and packages only; artifacts/bin and artifacts/obj are build output.
        path: |
          artifacts/TestResults/**
          artifacts/package/**
  # The unit tests once more, the way the library runs where the runtime cannot generate code: mapping plans
  # are expression trees, and there they are interpreted instead of compiled. The tests that cannot pass that
  # way are marked in the sources and listed in docs/source/Native-AOT-and-trimming.md.
  interpreted:
    name: test, plans interpreted (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Unit tests with dynamic code switched off
      run: dotnet test src/UnitTests -c Release -p:DynamicCodeSupport=false
      env:
        # Makes the run fail if the switch above did not reach the tests.
        FORKFORWARD_TEST_EXPECT_INTERPRETED: 'true'
  # The tests that need no database once more, built with the .NET 11 SDK and run on the .NET 11 runtime.
  # The build job above stays on .NET 10; this one says early when the next .NET breaks something.
  dotnet11:
    name: test, .NET 11 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Makes the run fail if the tests ran on another runtime than the one named here.
      FORKFORWARD_TEST_EXPECT_RUNTIME: '11'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    # The test projects target net10.0; RollForward lets them start on the newest runtime installed.
    - name: Unit tests
      run: dotnet test src/UnitTests -c Release -p:RollForward=LatestMajor
    - name: Dependency injection tests
      run: dotnet test src/ForkForward.Mapper.DI.Tests -c Release -p:RollForward=LatestMajor
