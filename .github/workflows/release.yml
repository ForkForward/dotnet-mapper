name: Release

# Builds, tests, packs and publishes ForkForward.Mapper for a version tag such as
# v14.1.0 or v14.1.0-preview.1.
#
# Publishing uses NuGet Trusted Publishing: the publish job exchanges a GitHub OIDC token
# for a NuGet API key that is valid for one hour, so no NuGet key is stored in this repository.
# The matching policy on nuget.org names this repository, this workflow file (release.yml)
# and the environment "release".
on:
  push:
    tags:
    - 'v*.*.*'
permissions:
  contents: read

jobs:
  build:
    # The integration tests need SQL Server LocalDB, which exists only on Windows.
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # 10.0 builds the solution; 9.0 is the runtime the tests target.
        dotnet-version: |
          9.0.x
          10.0.x
    - name: Install SQL Server LocalDB
      run: ./Setup.ps1
      shell: pwsh
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          artifacts/*.nupkg
          artifacts/*.snupkg
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A maintainer decides what is released: add required reviewers to this environment
    # in the repository settings and the job waits for their approval.
    environment: release
    permissions:
      id-token: write  # lets this job request the GitHub OIDC token that nuget.org trusts
    steps:
    - name: Packages
      uses: actions/download-artifact@v4
      with:
        name: packages
        path: packages
    # The API key is valid for one hour, so it is requested right before the push.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        # The nuget.org profile name of the publishing account (https://www.nuget.org/profiles/ForkForward),
        # not its e-mail address. It is public, so it does not need to be a secret.
        user: ForkForward
    # Pushing a .nupkg also pushes the .snupkg next to it to the symbol server.
    - name: NuGet push
      run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
