name: Release

# Builds, tests, packs and publishes ForkForward.Mapper for a version tag such as
# v14.1.0 or v14.1.0-preview.1.
#
# Publishing uses NuGet Trusted Publishing: the publish job exchanges a GitHub OIDC token
# for a NuGet API key that is valid for one hour, so no NuGet key is stored in this repository.
# The matching policy on nuget.org names this repository, this workflow file (release.yml)
# and the environment "release".
#
# After the push the job creates the GitHub release for the tag, with the matching section of
# CHANGELOG.md as its notes and the packages attached.
on:
  push:
    tags:
    - 'v*.*.*'
permissions:
  contents: read

jobs:
  build:
    # The integration tests need SQL Server LocalDB, which exists only on Windows.
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 10 SDK builds everything, and the tests run on the .NET 10 runtime it brings.
        dotnet-version: 10.0.x
    - name: Install SQL Server LocalDB
      run: ./Setup.ps1
      shell: pwsh
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Packages
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          artifacts/package/release/*.nupkg
          artifacts/package/release/*.snupkg
        if-no-files-found: error

  # The release is compared with the previous one before it is published:
  # nothing slower, and nothing that allocates more, goes out. See Benchmark.ps1.
  benchmark:
    uses: ./.github/workflows/benchmark.yml

  publish:
    needs: [build, benchmark]
    runs-on: ubuntu-latest
    # A maintainer decides what is released: add required reviewers to this environment
    # in the repository settings and the job waits for their approval.
    environment: release
    permissions:
      id-token: write  # lets this job request the GitHub OIDC token that nuget.org trusts
      contents: write  # creates the GitHub release
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: CHANGELOG.md
        sparse-checkout-cone-mode: false
    - name: Packages
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: packages
    # The API key is valid for one hour, so it is requested right before the push.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        # The nuget.org user name of the person who created the Trusted Publishing policy.
        # It is not the organization that owns the policy (ForkForward) and not an e-mail address:
        # nuget.org rejects the login with HTTP 401 for either of those.
        user: ${{ secrets.NUGET_USER }}
    # Pushing a .nupkg also pushes the .snupkg next to it to the symbol server.
    - name: NuGet push
      run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    # The notes are the section of CHANGELOG.md whose heading names this version; the whole file when there is none.
    - name: GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:GITHUB_REF_NAME
        $version = $tag.TrimStart('v')
        $lines = Get-Content CHANGELOG.md -Encoding utf8
        $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
        if ($start) {
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $notes = if ($next) { $rest[0..($next - 2)] } else { $rest }
        }
        else {
          $notes = @("See CHANGELOG.md.")
        }
        $notes += ''
        $notes += "Package: https://www.nuget.org/packages/ForkForward.Mapper/$version"
        Set-Content -Path notes.md -Value $notes -Encoding utf8
        $prerelease = @()
        if ($version -match '-') { $prerelease = @('--prerelease') }
        gh release create $tag --title "ForkForward.Mapper $version" --notes-file notes.md @prerelease (Get-ChildItem packages/*.nupkg, packages/*.snupkg | ForEach-Object { $_.FullName })
