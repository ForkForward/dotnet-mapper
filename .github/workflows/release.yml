name: Release

# Builds, tests, packs and publishes ForkForward.Mapper for a version tag such as
# v14.1.0 or v14.1.0-preview.1.
#
# Publishing uses NuGet Trusted Publishing: the publish job exchanges a GitHub OIDC token
# for a NuGet API key that is valid for one hour, so no NuGet key is stored in this repository.
# The matching policy on nuget.org names this repository, this workflow file (release.yml)
# and the environment "release".
#
# After the push the job creates the GitHub release for the tag, with the matching section of
# CHANGELOG.md as its notes and the packages attached.
#
# Every package gets a build provenance attestation: a signed statement that it was built by this
# workflow from this tag. When a code-signing certificate is configured, the packages also get an
# author signature before they are published. See docs/security/package-signing.md.
on:
  push:
    tags:
    - 'v*.*.*'
permissions:
  contents: read

jobs:
  build:
    # The integration tests need SQL Server LocalDB, which exists only on Windows.
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer computes the version from the tags, so it needs the full history.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The library targets net10.0 and net11.0. The .NET 11 SDK builds both; the .NET 10 SDK is
        # installed for its runtime, which everything that targets net10.0 runs on.
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Install SQL Server LocalDB
      run: ./Setup.ps1
      shell: pwsh
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Packages
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          artifacts/package/release/*.nupkg
          artifacts/package/release/*.snupkg
        if-no-files-found: error

  # The release is compared with the previous one before it is published:
  # nothing slower, and nothing that allocates more, goes out. See Benchmark.ps1.
  benchmark:
    uses: ./.github/workflows/benchmark.yml

  # The author signature. The job runs only when a code-signing certificate is configured: the repository
  # variable SIGNING_PROVIDER says where it is, and docs/security/package-signing.md lists what belongs to
  # each provider. Without it the packages are published as they were built; they still get the build
  # provenance attestation below and, as every package on nuget.org, nuget.org's own repository signature.
  sign:
    needs: build
    if: vars.SIGNING_PROVIDER != ''
    # The Sign CLI, which Sign.ps1 uses, runs on Windows only.
    runs-on: windows-latest
    # The certificate is reachable from this environment only, like the right to publish.
    environment: release
    permissions:
      id-token: write  # signs in to Azure without a stored secret, for a certificate in Azure Key Vault
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: Sign.ps1
        sparse-checkout-cone-mode: false
    - name: Packages
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # A fixed version: this tool is given the certificate. It is a prerelease; there is no other kind yet.
    - name: Install the Sign CLI
      run: dotnet tool install --tool-path sign-tool sign --version 0.9.1-beta.26552.4
    - name: Azure login
      if: vars.SIGNING_PROVIDER == 'azure-key-vault'
      uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        allow-no-subscriptions: true
    # Sign.ps1 signs every package and then checks that each one verifies, on this machine, as signed by a
    # trusted certificate. A package that does not is never uploaded, so it cannot be published.
    - name: Sign and verify
      shell: pwsh
      env:
        SIGNING_PROVIDER: ${{ vars.SIGNING_PROVIDER }}
        SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        SIGNING_CERTIFICATE_FINGERPRINT: ${{ vars.SIGNING_CERTIFICATE_FINGERPRINT }}
        SIGNING_KEY_VAULT_URL: ${{ vars.SIGNING_KEY_VAULT_URL }}
        SIGNING_KEY_VAULT_CERTIFICATE: ${{ vars.SIGNING_KEY_VAULT_CERTIFICATE }}
        # certificate-file: the .pfx file, Base64-encoded, and its password.
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        $arguments = @{ Provider = $env:SIGNING_PROVIDER; PackagesDirectory = 'packages'; SignTool = (Resolve-Path sign-tool/sign.exe).Path }
        if ($env:SIGNING_TIMESTAMP_URL) { $arguments.TimestampUrl = $env:SIGNING_TIMESTAMP_URL }
        if ($env:SIGNING_CERTIFICATE_FINGERPRINT) { $arguments.CertificateFingerprint = $env:SIGNING_CERTIFICATE_FINGERPRINT }
        if ($env:SIGNING_KEY_VAULT_URL) { $arguments.KeyVaultUrl = $env:SIGNING_KEY_VAULT_URL }
        if ($env:SIGNING_KEY_VAULT_CERTIFICATE) { $arguments.KeyVaultCertificate = $env:SIGNING_KEY_VAULT_CERTIFICATE }
        $certificateFile = $null
        try {
          if ($env:SIGNING_PROVIDER -eq 'certificate-file') {
            if (-not $env:SIGNING_CERTIFICATE) { throw 'The secret SIGNING_CERTIFICATE is not set.' }
            $certificateFile = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
            $arguments.CertificateFile = $certificateFile
          }
          ./Sign.ps1 @arguments
        }
        finally {
          if ($certificateFile -and (Test-Path $certificateFile)) { Remove-Item $certificateFile -Force }
        }
    - name: Signed packages
      uses: actions/upload-artifact@v7
      with:
        name: packages-signed
        path: |
          packages/*.nupkg
          packages/*.snupkg
        if-no-files-found: error

  publish:
    needs: [build, benchmark, sign]
    # The sign job is skipped when no certificate is configured, and a skipped job must not skip the release.
    # So: the build and the benchmark succeeded, and signing succeeded or was not asked for.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.benchmark.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A maintainer decides what is released: add required reviewers to this environment
    # in the repository settings and the job waits for their approval.
    environment: release
    permissions:
      id-token: write      # the GitHub OIDC token: nuget.org trusts it, and the attestation is signed with it
      contents: write      # creates the GitHub release
      attestations: write  # stores the build provenance attestation
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: CHANGELOG.md
        sparse-checkout-cone-mode: false
    - name: Packages
      uses: actions/download-artifact@v8
      with:
        # The signed packages when the sign job ran, the packages as they were built otherwise.
        name: ${{ needs.sign.result == 'success' && 'packages-signed' || 'packages' }}
        path: packages
    # A statement, signed through GitHub's Sigstore instance and kept by GitHub, that these exact files were
    # built by this workflow run from this tag. It needs no certificate. Anyone can check a package taken
    # from the GitHub release with: gh attestation verify <file> -R ForkForward/dotnet-mapper
    - name: Attest build provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          packages/*.nupkg
          packages/*.snupkg
    # The API key is valid for one hour, so it is requested right before the push.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        # The nuget.org user name of the person who created the Trusted Publishing policy.
        # It is not the organization that owns the policy (ForkForward) and not an e-mail address:
        # nuget.org rejects the login with HTTP 401 for either of those.
        user: ${{ secrets.NUGET_USER }}
    # Pushing a .nupkg also pushes the .snupkg next to it to the symbol server.
    - name: NuGet push
      run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    # The notes are the section of CHANGELOG.md whose heading names this version; the whole file when there is none.
    - name: GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:GITHUB_REF_NAME
        $version = $tag.TrimStart('v')
        $lines = Get-Content CHANGELOG.md -Encoding utf8
        $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
        if ($start) {
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $notes = if ($next) { $rest[0..($next - 2)] } else { $rest }
        }
        else {
          $notes = @("See CHANGELOG.md.")
        }
        $notes += ''
        $notes += "Package: https://www.nuget.org/packages/ForkForward.Mapper/$version"
        Set-Content -Path notes.md -Value $notes -Encoding utf8
        $prerelease = @()
        if ($version -match '-') { $prerelease = @('--prerelease') }
        gh release create $tag --title "ForkForward.Mapper $version" --notes-file notes.md @prerelease (Get-ChildItem packages/*.nupkg, packages/*.snupkg | ForEach-Object { $_.FullName })
