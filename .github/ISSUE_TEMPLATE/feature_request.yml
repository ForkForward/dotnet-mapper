name: Feature or maintenance request
description: Support for a new .NET version, a dependency update, or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ForkForward.Mapper exists to keep the MIT-licensed AutoMapper code working on current .NET.
        Maintenance requests come first. New features are considered when they do not break compatibility with AutoMapper 14.0.0.
  - type: textarea
    id: problem
    attributes:
      label: What do you need?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe it in your own words. Do not paste code from AutoMapper releases newer than 14.0.0; it cannot be used here.
  - type: dropdown
    id: compatibility
    attributes:
      label: Would this change the public API or existing behaviour?
      options:
        - "No"
        - "Yes"
        - "I do not know"
    validations:
      required: true
